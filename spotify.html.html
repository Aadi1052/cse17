<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify Web</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
* {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: #121212;
    color: white;
}

.container {
    display: flex;
}

/* Sidebar */
.sidebar {
    width: 200px;
    height: 100vh;
    background-color: #000;
    padding: 20px;
}

.sidebar h2 {
    color: #1db954;
    margin-bottom: 20px;
}

.sidebar ul {
    list-style: none;
}

.sidebar li {
    padding: 10px 0;
    cursor: pointer;
}

/* Main Section */
.main {
    flex: 1;
    padding: 20px;
}

/* Header */
.header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
}

.header button {
    background-color: #1db954;
    border: none;
    padding: 8px 15px;
    margin-left: 10px;
    border-radius: 20px;
    cursor: pointer;
}

/* Cards */
.cards {
    display: flex;
    gap: 20px;
}

.card {
    background-color: #181818;
    padding: 15px;
    width: 180px;
    border-radius: 10px;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card h4 {
    margin-top: 10px;
}

        </style>
</head>
<body>

<div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Spotify</h2>
        <ul>
            <li>🏠 Home</li>
            <li>🔍 Search</li>
            <li>📁 Your Library</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="header">
            <button>Upgrade</button>
            <button class="profile">Profile</button>
        </div>

        <h2>Recently Played</h2>

        <div class="cards">
            <div class="card">
                <img src="https://via.placeholder.com/150">
                <h4>Top Hits</h4>
                <p>Best of 2025</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/150">
                <h4>Chill</h4>
                <p>Relaxing music</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/150">
                <h4>Workout</h4>
                <p>Energy boost</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
